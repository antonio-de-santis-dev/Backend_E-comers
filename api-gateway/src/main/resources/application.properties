spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=user-servis
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-servis
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**,/api/user-accounts/**,/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=product-servis
spring.cloud.gateway.server.webflux.routes[1].uri=lb://product-servis
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webflux.routes[2].id=order-servis
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-servis
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**