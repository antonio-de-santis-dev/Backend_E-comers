spring.application.name=product-servis
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/productdb
spring.datasource.username=productadmin
spring.datasource.password=productpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.com.it.productservis=INFO